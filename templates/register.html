<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إنشاء حساب - Kanaw</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #000; color: #fff; height: 100dvh; display: flex; align-items: center; justify-content: center; overflow: hidden; background-image: radial-gradient(circle at 50% 0%, rgba(254,44,85,0.15) 0%, transparent 50%), radial-gradient(circle at 50% 100%, rgba(0,242,234,0.15) 0%, transparent 50%); }
        .login-container { width: 90%; max-width: 400px; padding: 40px 30px; background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-icon { font-size: 50px; color: #00f2ea; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(0,242,234,0.5)); }
        .logo-text { font-size: 28px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(45deg, #fe2c55, #00f2ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input { width: 100%; padding: 16px 20px 16px 45px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #fe2c55; background: rgba(255,255,255,0.08); box-shadow: 0 0 15px rgba(254,44,85,0.2); }
        .input-group i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #888; font-size: 18px; }
        .input-group input:focus + i { color: #fe2c55; }
        .btn-submit { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(45deg, #fe2c55, #ff5e7e); color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; box-shadow: 0 4px 15px rgba(254,44,85,0.4); }
        .btn-submit:active { transform: scale(0.96); }
        .msg { color: #ff4444; background: rgba(255,68,68,0.1); border: 1px solid #ff4444; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; text-align: center; animation: shake 0.3s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .footer-links { text-align: center; margin-top: 25px; font-size: 14px; color: #888; }
        .footer-links a { color: #fff; text-decoration: none; font-weight: bold; margin-right: 5px; transition: 0.2s; }
        .footer-links a:hover { color: #fe2c55; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <i class="fa-solid fa-user-plus logo-icon"></i>
            <div class="logo-text">إنشاء حساب</div>
            <p style="color: #888; font-size: 13px; margin-top: 5px;">انضم إلى Kanaw وشارك فيديوهاتك</p>
        </div>
        {% with messages = get_flashed_messages() %}{% if messages %}{% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
        <form method="POST">
            <div class="input-group">
                <input type="text" name="username" placeholder="اسم المستخدم (فريد)" required pattern="[A-Za-z0-9_]+" minlength="5" title="5 أحرف إنجليزية على الأقل، بدون مسافات" required>
                <i class="fa-solid fa-at"></i>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="كلمة المرور" required minlength="9" title="9 أحرف على الأقل" required>
                <i class="fa-solid fa-lock"></i>
            </div>
            <button type="submit" class="btn-submit">تسجيل الآن</button>
        </form>
        <div class="footer-links">
            لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a>
        </div>
    </div>
</body>
</html>
