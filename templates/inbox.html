<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسائل - Kanaw</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; margin: 0; padding-bottom: 60px; }
        .header { padding: 15px 20px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #222; }
        .stories { display: flex; overflow-x: auto; padding: 15px; gap: 15px; border-bottom: 1px solid #222; }
        .story { width: 65px; height: 65px; border-radius: 50%; border: 3px solid #fe2c55; padding: 2px; flex-shrink: 0; }
        .story img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .chat-item { display: flex; align-items: center; gap: 15px; padding: 12px 20px; text-decoration: none; color: white; border-bottom: 1px solid #222; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: #333; display: flex; justify-content: center; align-items: center; font-size: 24px; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-info { flex: 1; }
        .chat-name { font-weight: bold; margin-bottom: 3px; }
        .chat-msg { font-size: 12px; color: #888; }
        /* زر إنشاء مجموعة عائم */
        .fab { position: fixed; bottom: 80px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #fe2c55; color: white; border: none; font-size: 24px; box-shadow: 0 4px 15px rgba(254,44,85,0.5); cursor: pointer; z-index: 100; display: flex; justify-content: center; align-items: center; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
        .bottom-nav a { color: #888; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; }
        .bottom-nav a.active { color: #fff; }
        /* نافذة إنشاء مجموعة */
        #createGroupModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; }
        .modal-content { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:#222; width:90%; max-width:400px; padding:20px; border-radius:15px; text-align:center; }
        .modal-content input { width:100%; padding:12px; margin-bottom:20px; border-radius:8px; border:none; background:#333; color:white; box-sizing:border-box; text-align:center; }
        .modal-actions { display:flex; gap:10px; }
        .modal-actions button { flex:1; padding:12px; border-radius:8px; border:none; font-weight:bold; cursor:pointer; }
        .btn-save { background:#fe2c55; color:white; }
        .btn-cancel { background:#444; color:white; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" style="color:white;"><i class="fa-solid fa-arrow-right"></i></a>
        <span>الرسائل</span>
        <div></div>
    </div>

    <div class="stories">
        {% for story in stories %}
        <div class="story"><img src="{{ story.media_url }}"></div>
        {% endfor %}
    </div>

    {% for group in groups %}
    <a href="/chat_group/{{ group.id }}" class="chat-item">
        <div class="avatar" style="background:#fe2c55;"><i class="fa-solid fa-users"></i></div>
        <div class="chat-info">
            <div class="chat-name">{{ group.name }}</div>
            <div class="chat-msg">{{ group.members|length }} عضو</div>
        </div>
    </a>
    {% endfor %}

    {% for user in users %}
    <a href="/chat/{{ user.username }}" class="chat-item">
        <div class="avatar">{% if user.profile_pic %}<img src="{{ user.profile_pic }}">{% else %}👤{% endif %}</div>
        <div class="chat-info">
            <div class="chat-name">@{{ user.username }}</div>
        </div>
    </a>
    {% endfor %}

    <!-- زر إنشاء مجموعة -->
    <button class="fab" onclick="document.getElementById('createGroupModal').style.display='block'"><i class="fa-solid fa-users"></i></button>

    <!-- نافذة الإنشاء -->
    <div id="createGroupModal">
        <div class="modal-content">
            <h3>إنشاء مجموعة جديدة</h3>
            <input type="text" id="groupNameInput" placeholder="اسم المجموعة">
            <div class="modal-actions">
                <button onclick="document.getElementById('createGroupModal').style.display='none'" class="btn-cancel">إلغاء</button>
                <button onclick="submitCreateGroup()" class="btn-save">إنشاء</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="/"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <a href="/trending"><i class="fa-solid fa-fire"></i> الترند</a>
        <a href="/inbox" class="active"><i class="fa-solid fa-envelope"></i> الرسائل</a>
        <a href="/profile/{{ current_user.username }}"><i class="fa-solid fa-user"></i> حسابي</a>
    </div>

    <script>
        async function submitCreateGroup() {
            const name = document.getElementById('groupNameInput').value.trim();
            if (!name) return alert('الرجاء إدخال اسم المجموعة');
            
            const btn = event.target;
            btn.disabled = true; btn.innerText = 'جاري الإنشاء...';
            
            try {
                const res = await fetch('/api/create_group', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: name})
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/chat_group/' + data.group_id;
                } else {
                    alert('فشل إنشاء المجموعة');
                    btn.disabled = false; btn.innerText = 'إنشاء';
                }
            } catch (e) {
                alert('خطأ في الاتصال');
                btn.disabled = false; btn.innerText = 'إنشاء';
            }
        }
    </script>
</body>
</html>
