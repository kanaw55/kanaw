<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>#{{ tag }} - Kanaw</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; margin: 0; padding-bottom: 60px; text-align: center; }
        .header { background: #222; padding: 20px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 15px; }
        .header a { color: #fff; text-decoration: none; font-size: 20px; }
        .header h2 { margin: 0; font-size: 20px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }
        .vid-box { background: #222; aspect-ratio: 9/16; position: relative; overflow: hidden; cursor: pointer; }
        .vid-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .views-overlay { position: absolute; bottom: 5px; left: 5px; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 3px black; display: flex; align-items: center; gap: 4px;}
        .empty-msg { text-align: center; color: #888; padding: 50px 20px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .bottom-nav a { color: #888; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .bottom-nav a.active { color: #fff; }
        .bottom-nav a i { font-size: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/"><i class="fa-solid fa-arrow-right"></i></a>
        <h2>#{{ tag }}</h2>
    </div>

    {% if videos %}
        <div class="grid">
            {% for video in videos %}
            <div class="vid-box" onclick="window.location.href='/?video_id={{ video.id }}'">
                <img src="{{ video.filename|replace('.mp4', '.jpg') }}" onerror="this.src='https://via.placeholder.com/150/333/fff?text=Video'">
                <div class="views-overlay"><i class="fa-solid fa-play"></i> {{ video.views }}</div>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="empty-msg">
            <h2><i class="fa-solid fa-hashtag"></i></h2>
            <p>لا توجد فيديوهات تحتوي على هذا الهاشتاق بعد.</p>
        </div>
    {% endif %}

    <div class="bottom-nav">
        <a href="/"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <a href="/search"><i class="fa-solid fa-magnifying-glass"></i> بحث</a>
        <a href="{% if current_user.is_authenticated %}/upload{% else %}/login{% endif %}"><i class="fa-solid fa-circle-plus" style="font-size: 24px;"></i></a>
        <a href="{% if current_user.is_authenticated %}/inbox{% else %}/login{% endif %}"><i class="fa-solid fa-envelope"></i> الرسائل</a>
        <a href="{% if current_user.is_authenticated %}/profile/{{ current_user.username }}{% else %}/login{% endif %}"><i class="fa-solid fa-user"></i> حسابي</a>
    </div>

    <script>
    (function(){
        if (window.__apiGuard) return;
        window.__apiGuard = true;
        const origFetch = window.fetch;
        window.fetch = function(...args){
            return origFetch.apply(this, args).then(function(res){
                if (res.status === 401) {
                    res.clone().json().then(function(d){
                        if (d && d.login_url) window.location.href = d.login_url;
                        else window.location.href = '/login?next=' + encodeURIComponent(location.pathname);
                    }).catch(function(){
                        window.location.href = '/login?next=' + encodeURIComponent(location.pathname);
                    });
                }
                return res;
            });
        };
    })();
    </script>

</body>
</html>
